spring.application.name=securityapp
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.api.base-url=${APP_API_BASE_URL:http://localhost:${server.port}}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-key-to-a-long-random-value-before-deploy}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.aes.secret=${APP_AES_SECRET:change-this-32-char-aes-secret-key}

spring.jpa.open-in-view=false
