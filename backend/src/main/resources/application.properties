spring.application.name=securityapp
spring.profiles.default=local

server.port=${BACKEND_PORT:8080}
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

app.api.base-url=${APP_API_BASE_URL:https://localhost}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost,http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expire-minutes=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:15}
app.jwt.refresh-expire-days=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}
app.password-reset.expire-minutes=${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:15}
app.password-reset.demo-mode=${PASSWORD_RESET_DEMO_MODE:true}
app.encryption.key=${ENCRYPTION_KEY}
app.webhook.hmac-secret=${HMAC_WEBHOOK_SECRET}
app.webhook.max-age-seconds=${WEBHOOK_MAX_AGE_SECONDS:300}
app.rate-limit.login-limit=${RATE_LIMIT_LOGIN_PER_MINUTE:5}
app.rate-limit.register-limit=${RATE_LIMIT_REGISTER_PER_MINUTE:3}
app.rate-limit.password-reset-limit=${RATE_LIMIT_PASSWORD_RESET_PER_MINUTE:3}
app.rate-limit.webhook-limit=${RATE_LIMIT_WEBHOOK_PER_MINUTE:10}
app.rate-limit.admin-limit=${RATE_LIMIT_ADMIN_PER_MINUTE:30}
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.student-password=${APP_SEED_STUDENT_PASSWORD:Password123!}
app.seed.instructor-password=${APP_SEED_INSTRUCTOR_PASSWORD:Password123!}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:Admin123!}

spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=never
