spring.application.name=securityapp
spring.profiles.default=local

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.jackson.time-zone=UTC

app.api.base-url=${APP_API_BASE_URL:http://localhost:${server.port}}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://localhost,https://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-key-to-a-long-random-value-before-deploy}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.aes.secret=${APP_AES_SECRET:change-this-32-char-aes-secret-key}
app.aes.current-key-version=${APP_AES_CURRENT_KEY_VERSION:2}
app.aes.hkdf-salt=${APP_AES_HKDF_SALT:securityapp-hkdf-salt}
app.demo-users.enabled=${APP_DEMO_USERS_ENABLED:true}
app.demo-users.password=${APP_DEMO_USERS_PASSWORD:Password@123}

spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=never
