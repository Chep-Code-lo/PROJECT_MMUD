# Copy this file to deploy/cloudflared/config.local.yml
# and replace the placeholder values on your own machine.
#
# This config is used by the Docker cloudflared service, not by the local host.
# Copy the tunnel credential JSON into:
#   deploy/cloudflared/credentials/<tunnel-uuid>.json

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/credentials/REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: demo.example.com
    service: https://nginx:443
    originRequest:
      noTLSVerify: true
  - service: http_status:404
