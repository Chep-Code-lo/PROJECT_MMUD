services:
  database:
    image: mysql:8.4
    container_name: securityapp-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securityapp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_USER: ${MYSQL_APP_USERNAME:-securityapp}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
    ports:
      - "${LOCAL_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
    container_name: securityapp-backend
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BACKEND_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:mysql://database:3306/securityapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-securityapp}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me-app-password}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-with-at-least-32-characters}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-encryption-key-with-at-least-32-characters}
      HMAC_WEBHOOK_SECRET: ${HMAC_WEBHOOK_SECRET:-change-me-webhook-secret-with-at-least-32-characters}
      WEBHOOK_MAX_AGE_SECONDS: ${WEBHOOK_MAX_AGE_SECONDS:-300}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
      RATE_LIMIT_REGISTER_PER_MINUTE: ${RATE_LIMIT_REGISTER_PER_MINUTE:-3}
      RATE_LIMIT_WEBHOOK_PER_MINUTE: ${RATE_LIMIT_WEBHOOK_PER_MINUTE:-10}
      RATE_LIMIT_ADMIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_PER_MINUTE:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,http://localhost:3000}
      APP_API_BASE_URL: ${APP_API_BASE_URL:-https://localhost}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_STUDENT_PASSWORD: ${APP_SEED_STUDENT_PASSWORD:-Password123!}
      APP_SEED_INSTRUCTOR_PASSWORD: ${APP_SEED_INSTRUCTOR_PASSWORD:-Password123!}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-Admin123!}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  frontend:
    build:
      context: ./frontend
    container_name: securityapp-frontend
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    build:
      context: ./deploy/nginx
    container_name: securityapp-nginx
    ports:
      - "${LOCAL_HTTP_PORT:-80}:80"
      - "${LOCAL_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${LOCAL_SWAGGER_HTTPS_PORT:-8444}:8444"
    volumes:
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mysql_data:
