services:
  database:
    image: mysql:8.4
    container_name: securityapp-db
    environment:
      MYSQL_DATABASE: securityapp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
    container_name: securityapp-backend
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/securityapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_JWT_SECRET: change-this-secret-key-to-a-long-random-value-before-deploy
      APP_AES_SECRET: change-this-32-char-aes-secret-key
      APP_DEMO_USERS_ENABLED: "true"
      APP_DEMO_USERS_PASSWORD: Password@123
      APP_API_BASE_URL: https://localhost
      APP_CORS_ALLOWED_ORIGINS: https://localhost,https://127.0.0.1
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: securityapp-frontend
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./deploy/nginx
    container_name: securityapp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
