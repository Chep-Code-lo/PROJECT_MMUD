$kind: http-request
url: "{{baseUrl}}/api/courses/{{pendingCourseId}}/enrollment-requests"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      pm.collectionVariables.set('pendingEnrollmentId', String(data.enrollmentId));
    language: text/javascript
order: 6000
