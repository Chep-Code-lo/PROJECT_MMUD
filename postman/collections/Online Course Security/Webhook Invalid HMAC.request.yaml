$kind: http-request
url: "{{baseUrl}}/api/webhooks/payment-success"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "enrollmentId": {{pendingEnrollmentId}},
      "userId": {{studentUserId}},
      "courseId": {{pendingCourseId}},
      "paymentReference": "PAY-INVALID-001",
      "amount": {{courseAmount}}
    }
scripts:
  - type: beforeRequest
    code: |-
      const eventId = `evt_invalid_${Date.now()}`;
      const timestamp = Math.floor(Date.now() / 1000).toString();
      pm.request.headers.upsert({ key: 'X-Event-Id', value: eventId });
      pm.request.headers.upsert({ key: 'X-Timestamp', value: timestamp });
      pm.request.headers.upsert({ key: 'X-Signature', value: 'bad-signature' });
    language: text/javascript
order: 18000
